<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triff.co</title>
<style>
  :root{
    --bg:#111216; --fg:#e9e9ec; --dim:#9a9aa2; --card:#1a1b20;
    --edge:#2a2b31; --accent:#7aa2ff;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f6f4; --fg:#1b1c20; --dim:#5c5c66; --card:#fff; --edge:#e3e3df; --accent:#3a63d8; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center; padding:56px 20px;
  }
  main{width:100%; max-width:640px}
  h1{margin:0 0 4px; font-size:28px; letter-spacing:-.02em}
  .sub{color:var(--dim); margin:0 0 36px}
  .cat{font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:28px 0 10px}
  a.tool{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--edge); border-radius:12px;
    padding:15px 18px; margin:0 0 10px; transition:border-color .15s;
  }
  a.tool:hover{border-color:var(--accent)}
  .name{font-weight:600; font-size:16px}
  .name .ext{color:var(--dim); font-weight:400}
  .what{color:var(--dim); margin:3px 0 0; font-size:14px}
  footer{color:var(--dim); font-size:13px; margin-top:40px}
  footer a{color:var(--accent); text-decoration:none}
</style>
<main>
  <h1>triff.co</h1>
  <p class="sub">Tools and apps - some useful, some just because.</p>

  <div class="cat">Music</div>
  <a class="tool" href="./tr_musictools/theme-o-matic/">
    <div class="name">theme-o-matic <span class="ext">- live app</span></div>
    <p class="what">Browser editor/generator for Ableton Live 12 <code>.ask</code> themes - HSV-driven, live preview, palette-from-photo.</p>
  </a>

  <footer>Source on <a href="https://github.com/triffski">GitHub</a>.</footer>
</main>
